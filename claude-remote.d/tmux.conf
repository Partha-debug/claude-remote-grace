# tmux settings for the claude-remote session (loaded with -f; user's ~/.tmux.conf is ignored)
# Ctrl-B is Claude Code's own "run in background" key, so the prefix is Ctrl-].
set -g prefix C-]
unbind C-b
bind C-] send-prefix
bind d detach-client

set -s escape-time 10
set -g default-terminal "tmux-256color"
# pass 24-bit colour through to xterm.js, and fill unused space with blanks (not dots)
set -as terminal-features ",xterm-256color:RGB"
set -g fill-character " "
set -g default-size 200x50
set -g window-size latest
set -g aggressive-resize on
set -g history-limit 50000
set -g mouse off
set -g focus-events on
set -g set-titles off
set -g allow-rename off
set -g remain-on-exit off

# minimal status line; status-right is filled in by job.sh with the end time
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-interval 30
set -g status-right ""          # job.sh sets node · time left · detach hint
set -g status-right-length 80
